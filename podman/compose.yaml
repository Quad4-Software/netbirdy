name: netbirdy

services:
  server:
    image: localhost/netbirdy-server:latest
    build:
      context: ..
      dockerfile: podman/Containerfile.server
    container_name: netbirdy-server
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "3478:3478/udp"
      - "9090:9090"
      - "9000:9000"
    volumes:
      - ./config.yaml:/etc/netbird/config.yaml:ro,Z
      - netbirdy-server-data:/var/lib/netbird
    healthcheck:
      # /health on :9000 stays unhealthy in combined mode (the multiplexed relay
      # registers no standalone listeners), so probe the OIDC discovery document.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/oauth2/.well-known/openid-configuration || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  dashboard:
    image: localhost/netbirdy-dashboard:latest
    build:
      context: ..
      dockerfile: podman/Containerfile.dashboard
    container_name: netbirdy-dashboard
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      NETBIRD_MGMT_API_ENDPOINT: "http://localhost:8081"
      NETBIRD_MGMT_GRPC_API_ENDPOINT: "http://localhost:8081"
      AUTH_AUTHORITY: "http://localhost:8081/oauth2"
      AUTH_CLIENT_ID: "netbird-dashboard"
      AUTH_CLIENT_SECRET: ""
      AUTH_AUDIENCE: "netbird-dashboard"
      USE_AUTH0: "false"
      AUTH_SUPPORTED_SCOPES: "openid profile email groups"
      AUTH_REDIRECT_URI: "/nb-auth"
      AUTH_SILENT_REDIRECT_URI: "/nb-silent-auth"
      LETSENCRYPT_DOMAIN: "none"

  # Optional: local Pocket ID for passkey login testing.
  # First-run admin setup happens in the browser at http://localhost:1411
  # (requires a secure context; localhost works).
  pocketid:
    profiles: ["pocketid"]
    image: ghcr.io/pocket-id/pocket-id:v2.18.0
    restart: unless-stopped
    ports:
      - "1411:1411"
    environment:
      APP_URL: "http://localhost:1411"
      TRUST_PROXY: "true"
      ENCRYPTION_KEY: "${POCKETID_ENCRYPTION_KEY:-change-me-please-32-bytes!!}"
    volumes:
      - pocketid-data:/app/backend/data

  # Optional: local Quad4 ID for passkey login testing.
  # First-run admin setup happens in the browser at http://localhost:1412
  # (requires a secure context; localhost works). The public hosted
  # instance is https://auth.quad4.io.
  quad4:
    profiles: ["quad4"]
    image: ghcr.io/quad4-software/quad4-id:v0.1.0
    restart: unless-stopped
    ports:
      - "1412:1411"
    environment:
      APP_URL: "http://localhost:1412"
      TRUST_PROXY: "true"
      ENCRYPTION_KEY: "${QUAD4_ENCRYPTION_KEY:-change-me-please-32-bytes!!}"
    volumes:
      - quad4-data:/app/data

  updater:
    profiles: ["updater"]
    image: localhost/netbirdy-updater:latest
    build:
      context: ..
      dockerfile: podman/Containerfile.updater
    container_name: netbirdy-updater
    restart: unless-stopped
    environment:
      - UPDATER_TOKEN=${NETBIRDY_UPDATER_TOKEN:-}
      - UPDATER_PROJECT=netbirdy
      - UPDATER_SERVICES=server,dashboard
      - UPDATER_IMAGE_PREFIX=${NETBIRDY_IMAGE_PREFIX:-ghcr.io/quad4-software/netbirdy-}
      - UPDATER_DATA_DIR=/data
      - UPDATER_BACKUP_DIR=/backups
    volumes:
      # rootless Podman socket; socket mount is host-root equivalent for the user
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock:/run/podman/podman.sock
      - netbirdy-server-data:/data
      - netbirdy-updater-backups:/backups
    security_opt:
      - no-new-privileges:true
      - label=disable # SELinux: socket access needs an unconfined domain
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "/netbirdy-updater", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  netbirdy-server-data:
  pocketid-data:
  quad4-data:
  netbirdy-updater-backups:
