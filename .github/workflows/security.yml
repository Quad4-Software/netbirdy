name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: "go.mod"

      - name: Run govulncheck
        run: |
          set -e
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -format json ./... > vuln.json || true
          python3 - <<'PYEOF'
          import json, sys
          ignore = {l.split("#")[0].strip() for l in open(".github/govulncheck-ignore.txt") if l.split("#")[0].strip()}
          buf, depth, ids = "", 0, set()
          for ch in open("vuln.json").read():
              buf += ch
              depth += {"{":1,"}":-1}.get(ch,0)
              if depth == 0 and buf.strip():
                  try:
                      obj = json.loads(buf)
                  except Exception:
                      sys.exit("govulncheck output unreadable")
                  f = obj.get("finding")
                  if f and f.get("osv"):
                      ids.add(f["osv"])
                  buf = ""
          bad = sorted(ids - ignore)
          if bad:
              print("unignored findings:", bad)
              sys.exit(1)
          print("govulncheck clean (ignored:", sorted(ignore), ")")
          PYEOF

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0

      - name: Run zizmor
        run: pipx run zizmor==1.9.0 --min-severity high --min-confidence high .github/workflows/

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@56339e523c0409420f6c2c9a2f4292bbb3c07dd3 # v4.8.0
