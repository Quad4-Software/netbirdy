name: release-fork
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
  packages: write
jobs:
  release:
    if: github.repository == 'Sudo-Ivan/netbirdy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@7a3fe6cf838d3739f89a15a8f2abfab9e8fc2d94 # v6.4.0
        with:
          go-version-file: go.mod
      - name: goreleaser
        uses: goreleaser/goreleaser-action@e662f24e7597a420428fc7bb8bc800d5e487bf43 # v6.4.0
        with:
          args: release --clean --skip sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_DOCKER_PUSH: "false"
      - name: login ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: server image
        run: |
          docker build -f podman/Containerfile.server -t ghcr.io/sudo-ivan/netbirdy-server:${{ github.ref_name }} -t ghcr.io/sudo-ivan/netbirdy-server:latest .
          docker push ghcr.io/sudo-ivan/netbirdy-server:${{ github.ref_name }}
          docker push ghcr.io/sudo-ivan/netbirdy-server:latest
      - name: dashboard image
        run: |
          docker build -f podman/Containerfile.dashboard -t ghcr.io/sudo-ivan/netbirdy-dashboard:${{ github.ref_name }} -t ghcr.io/sudo-ivan/netbirdy-dashboard:latest .
          docker push ghcr.io/sudo-ivan/netbirdy-dashboard:${{ github.ref_name }}
          docker push ghcr.io/sudo-ivan/netbirdy-dashboard:latest
