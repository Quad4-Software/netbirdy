name: Release NetBirdy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-fork-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/sudo-ivan/netbirdy-

jobs:
  meta:
    if: github.repository == 'Sudo-Ivan/netbirdy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      version: ${{ steps.derive.outputs.version }}
      appver: ${{ steps.derive.outputs.appver }}
      pkgver: ${{ steps.derive.outputs.pkgver }}
      stable: ${{ steps.derive.outputs.stable }}
      publish: ${{ steps.derive.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Derive release metadata
        id: derive
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
            publish=true
          else
            tag="v0.0.0-dryrun"
            publish=false
          fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag $tag is not a version tag" >&2; exit 1 ;;
          esac
          version="${tag#v}"
          appver=$(sh scripts/release/version.sh "$tag")
          pkgver="${appver%.0}"
          stable=true
          case "$version" in *-*) stable=false ;; esac
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "appver=$appver"
            echo "pkgver=$pkgver"
            echo "stable=$stable"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  goreleaser:
    needs: [meta]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      PUBLISH: ${{ needs.meta.outputs.publish }}
      STABLE: ${{ needs.meta.outputs.stable }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: "go.mod"

      - name: Install cross compilers
        run: sudo apt-get update && sudo apt-get install -y -q gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu

      - name: Generate the RPM changelog from git tags
        run: bash release_files/rpm-changelog.sh

      - name: Fill the RPM ISA provide version
        run: bash release_files/rpm-provides.sh

      - name: Set up Node.js
        if: needs.meta.outputs.publish == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install proxy web dependencies for license collection
        if: needs.meta.outputs.publish == 'true'
        run: |
          npm install -g pnpm@12.14.0
          pnpm install --frozen-lockfile --filter web --ignore-scripts

      - name: Set up QEMU
        if: needs.meta.outputs.publish == 'true'
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        if: needs.meta.outputs.publish == 'true'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select goreleaser mode
        id: mode
        run: |
          if [ "$PUBLISH" = "true" ]; then
            echo "args=release --clean --skip=sign" >> "$GITHUB_OUTPUT"
            echo "skip_docker=false" >> "$GITHUB_OUTPUT"
          else
            echo "args=release --snapshot --clean --skip=publish,sign" >> "$GITHUB_OUTPUT"
            echo "skip_docker=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$PUBLISH" = "true" ] && [ "$STABLE" = "true" ]; then
            echo "skip_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_DOCKER_PUSH: ${{ steps.mode.outputs.skip_docker }}
          SKIP_PUBLISH: ${{ steps.mode.outputs.skip_publish }}
        with:
          version: "~> v2"
          args: ${{ steps.mode.outputs.args }}

      - name: Collect release files
        run: |
          mkdir -p assets
          find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' -o -name '*_checksums.txt' \) -exec cp {} assets/ \;
          ls -l assets

      - name: Upload release files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: goreleaser-assets
          path: assets/
          if-no-files-found: error

  desktop-linux:
    needs: [meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLISH: ${{ needs.meta.outputs.publish }}
      APPVER: ${{ needs.meta.outputs.appver }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: "go.mod"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version_file_path: "package.json"

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y -q libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev gcc-mingw-w64-x86-64

      - name: Install wails3 and goversioninfo
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@b66839b # v1.7.0

      - name: Generate the Windows resource file
        run: |
          major=$(echo "$APPVER" | cut -d. -f1)
          minor=$(echo "$APPVER" | cut -d. -f2)
          patch=$(echo "$APPVER" | cut -d. -f3)
          goversioninfo -64 -icon client/ui/build/windows/icon.ico -manifest client/ui/build/windows/wails.exe.manifest \
            -product-name "NetBirdy UI" -copyright "NetBirdy Authors" \
            -ver-major "$major" -ver-minor "$minor" -ver-patch "$patch" -ver-build 0 \
            -file-version "$major.$minor.$patch.0" -product-version "$major.$minor.$patch.0" \
            -o client/ui/resources_windows_amd64.syso

      - name: Build the desktop app
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_PUBLISH: "true"
        with:
          version: "~> v2"
          args: ${{ needs.meta.outputs.publish == 'true' && 'release --config .goreleaser_ui.yaml --clean --skip=publish,sign' || 'release --config .goreleaser_ui.yaml --snapshot --clean --skip=publish,sign' }}

      - name: Build AppImage
        env:
          APPVER: ${{ needs.meta.outputs.appver }}
        run: |
          set -eu
          bin=$(find dist -type f -name netbirdy-ui -path '*linux*amd64*' | head -n 1)
          test -n "$bin"
          sh scripts/release/build-appimage.sh "$bin" "$APPVER" linux-ui

      - name: Collect files
        run: |
          mkdir -p linux-ui windows-ui
          find dist -maxdepth 1 -type f \( -name 'netbirdy-ui*.deb' -o -name 'netbirdy-ui*.rpm' -o -name 'netbirdy-ui-linux_*.tar.gz' \) -exec cp {} linux-ui/ \;
          exe=$(find dist -type f -name netbirdy-ui.exe | head -n 1)
          test -n "$exe"
          cp "$exe" windows-ui/netbirdy-ui.exe
          ls -l linux-ui windows-ui

      - name: Upload Linux desktop packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: desktop-linux
          path: linux-ui/
          if-no-files-found: error

      - name: Upload Windows desktop binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: desktop-windows-binary
          path: windows-ui/netbirdy-ui.exe
          if-no-files-found: error

  windows-installer:
    needs: [meta, desktop-linux]
    runs-on: windows-2022
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      APPVER: ${{ needs.meta.outputs.appver }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: "go.mod"

      - name: Download the desktop binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: desktop-windows-binary
          path: desktop

      - name: Build the client
        run: |
          $dir = "dist/netbird_windows_amd64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $ld = "-s -w -X github.com/netbirdio/netbird/version.version=$env:VERSION -X main.commit=$env:GITHUB_SHA -X main.date=$date -X main.builtBy=github-actions"
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags $ld -o "$dir/netbirdy.exe" ./client
          if ($LASTEXITCODE -ne 0) { throw "go build failed" }
          Copy-Item "desktop/netbirdy-ui.exe" "$dir/netbirdy-ui.exe"

      - name: Fetch wintun
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "wintun.zip"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51") { throw "wintun checksum mismatch: $hash" }
          $out = Join-Path $env:RUNNER_TEMP "wintun"
          Expand-Archive -Path $zip -DestinationPath $out
          Copy-Item "$out/wintun/bin/amd64/wintun.dll" "dist/netbird_windows_amd64/wintun.dll"

      - name: Install the NSIS plugins
        run: |
          $nsis = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path "$nsis\makensis.exe")) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "NSIS install failed" }
          }
          # NSIS plugins ship in the repo: nsis.sourceforge.io serves 403s.
          $envar = Resolve-Path ".github/nsis-plugins/EnVar_plugin.zip"
          if ((Get-FileHash -Path $envar -Algorithm SHA256).Hash.ToLower() -ne "e9aa92de351345ed82795251d838f1ae9041ba35af9d381a5780c7843b01f56a") { throw "EnVar plugin checksum mismatch" }
          $out = Join-Path $env:RUNNER_TEMP "envar"
          Expand-Archive -Path $envar -DestinationPath $out
          Copy-Item "$out\Plugins\x86-unicode\EnVar.dll" "$nsis\Plugins\x86-unicode\EnVar.dll" -Force
          $shell = Resolve-Path ".github/nsis-plugins/ShellExecAsUser_amd64-Unicode.7z"
          if ((Get-FileHash -Path $shell -Algorithm SHA256).Hash.ToLower() -ne "0a55ea25c7330a92cec028eda8afcaf1b1a7092e0dfb77c21c8f654564b4ff9d") { throw "ShellExecAsUser plugin checksum mismatch" }
          $out2 = Join-Path $env:RUNNER_TEMP "shellexec"
          & "C:\Program Files\7-Zip\7z.exe" x "-o$out2" $shell -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed" }
          Copy-Item "$out2\Plugins\x86-unicode\ShellExecAsUser.dll" "$nsis\Plugins\x86-unicode\ShellExecAsUser.dll" -Force

      - name: Stage the WebView2 bootstrapper
        run: |
          $ver = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$ver"
          if ($LASTEXITCODE -ne 0) { throw "wails3 install failed" }
          wails3 generate webview2bootstrapper -dir client
          if ($LASTEXITCODE -ne 0) { throw "webview2 bootstrapper generation failed" }
          if (-not (Test-Path "client/MicrosoftEdgeWebview2Setup.exe")) { throw "bootstrapper missing" }

      - name: Build the installer
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V3 "/DARCH=amd64" "/DWITH_UI" client\installer.nsis
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Move-Item netbirdy-installer.exe "out/netbirdy_installer_${env:VERSION}_windows_amd64.exe"

      - name: Upload installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-installer
          path: out/*.exe
          if-no-files-found: error

  macos-pkg:
    needs: [meta]
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PKGVER: ${{ needs.meta.outputs.pkgver }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: "go.mod"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version_file_path: "package.json"

      - name: Build the desktop frontend
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          (cd client/ui && "$(go env GOPATH)/bin/wails3" generate bindings -clean=true -ts)
          (cd client/ui/frontend && pnpm install --frozen-lockfile && pnpm build)

      - name: Build the app bundle and package
        run: |
          app="$RUNNER_TEMP/pkgroot/Applications/NetBirdy.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" out
          date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ld="-s -w -X github.com/netbirdio/netbird/version.version=$VERSION -X main.commit=$GITHUB_SHA -X main.date=$date -X main.builtBy=github-actions"
          CGO_ENABLED=0 GOOS=darwin GOARCH="$ARCH" go build -trimpath -ldflags "$ld" -o "$app/Contents/MacOS/netbirdy" ./client
          CGO_ENABLED=1 GOOS=darwin GOARCH="$ARCH" MACOSX_DEPLOYMENT_TARGET=11.0 go build -trimpath -tags production -ldflags "$ld" -o "$app/Contents/MacOS/netbirdy-ui" ./client/ui
          cp client/ui/build/darwin/Info.plist "$app/Contents/Info.plist"
          cp client/ui/build/darwin/icons.icns "$app/Contents/Resources/icons.icns"
          plutil -replace CFBundleVersion -string "$PKGVER" "$app/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$PKGVER" "$app/Contents/Info.plist"
          plutil -replace NSHumanReadableCopyright -string "NetBirdy Authors" "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          pkgbuild --root "$RUNNER_TEMP/pkgroot" \
            --scripts release_files/darwin_pkg \
            --identifier io.netbird.client \
            --version "$PKGVER" \
            --install-location / \
            "out/netbirdy_${VERSION}_darwin_${ARCH}.pkg"
          pkgutil --payload-files "out/netbirdy_${VERSION}_darwin_${ARCH}.pkg" | grep -q 'NetBirdy.app/Contents/MacOS/netbirdy-ui'
          pkgutil --payload-files "out/netbirdy_${VERSION}_darwin_${ARCH}.pkg" | grep -q 'NetBirdy.app/Contents/MacOS/netbirdy$'

      - name: Upload package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos-pkg-${{ matrix.arch }}
          path: out/*.pkg
          if-no-files-found: error

  images:
    needs: [meta, goreleaser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      STABLE: ${{ needs.meta.outputs.stable }}
      PUBLISH: ${{ needs.meta.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: needs.meta.outputs.publish == 'true'
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dashboard and updater images
        run: |
          zero="sha256:$(printf '0%.0s' $(seq 64))"
          if [ "$PUBLISH" = "true" ]; then
            for svc in dashboard updater; do
              tags="-t ${IMAGE_PREFIX}${svc}:${VERSION}"
              [ "$STABLE" = "true" ] && tags="$tags -t ${IMAGE_PREFIX}${svc}:latest"
              # shellcheck disable=SC2086
              docker buildx build --platform linux/amd64,linux/arm64 --push \
                --output type=image,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true \
                --metadata-file "meta-${svc}.json" -f "podman/Containerfile.${svc}" $tags .
              digest=$(jq -r '."containerimage.digest"' "meta-${svc}.json")
              echo "${svc}_digest=${digest}" >> "$GITHUB_ENV"
            done
            server_digest=$(docker buildx imagetools inspect "${IMAGE_PREFIX}server:${VERSION}" --format '{{json .Manifest}}' | jq -r '.digest')
            echo "server_digest=${server_digest}" >> "$GITHUB_ENV"
          else
            for svc in dashboard updater; do
              docker buildx build --platform linux/amd64 --load -t "dryrun-${svc}:test" -f "podman/Containerfile.${svc}" .
            done
            {
              echo "dashboard_digest=${zero}"
              echo "updater_digest=${zero}"
              echo "server_digest=${zero}"
            } >> "$GITHUB_ENV"
          fi

      - name: Write the image list
        run: |
          mkdir -p out
          sh scripts/release/images-list.sh "out/netbirdy_${VERSION}_images.txt" "$IMAGE_PREFIX" \
            "$server_digest" "$dashboard_digest" "$updater_digest"
          cat "out/netbirdy_${VERSION}_images.txt"

      - name: Upload image list
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: images-list
          path: out/*_images.txt
          if-no-files-found: error

  sign:
    needs: [meta, goreleaser, desktop-linux, windows-installer, macos-pkg, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: "go.mod"

      - name: Download release files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: inputs
          merge-multiple: true

      - name: Sign and verify
        env:
          ARTIFACT_KEY: ${{ secrets.NETBIRDY_ARTIFACT_KEY }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/artifact.key"
          trap 'shred -f "$key_file" 2>/dev/null || true; rm -f "$key_file"' EXIT
          printf '%s' "$ARTIFACT_KEY" > "$key_file"
          go build -o "$RUNNER_TEMP/signer" ./client/cmd/signer
          export SIGNER="$RUNNER_TEMP/signer"
          sh scripts/release/test.sh
          rm -f inputs/netbirdy-ui.exe
          merge=""
          for f in inputs/*_checksums.txt; do
            [ -f "$f" ] || continue
            merge="$RUNNER_TEMP/goreleaser_checksums.txt"
            mv "$f" "$merge"
          done
          sh scripts/release/sign.sh inputs "$VERSION" "$key_file" publickeys/artifact-signatures/keys/artifact-key-pub.pem "$merge"
          ls -l inputs

      - name: Upload signed release files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-assets
          path: inputs/
          if-no-files-found: error

  publish:
    if: needs.meta.outputs.publish == 'true'
    needs: [meta, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
      STABLE: ${{ needs.meta.outputs.stable }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download signed release files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-assets
          path: assets

      - name: Install cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign with cosign
        run: |
          for f in "assets/netbirdy_${VERSION}_checksums.txt" "assets/netbirdy_${VERSION}_images.txt"; do
            cosign sign-blob --yes --bundle "${f}.cosign.bundle" "$f"
          done
          while IFS= read -r image; do
            cosign sign --yes "$image"
          done < "assets/netbirdy_${VERSION}_images.txt"

      - name: Read image digests
        id: digests
        run: |
          list="assets/netbirdy_${VERSION}_images.txt"
          for svc in server dashboard updater; do
            line=$(grep "netbirdy-${svc}@" "$list")
            echo "${svc}_name=${line%@*}" >> "$GITHUB_OUTPUT"
            echo "${svc}_digest=${line#*@}" >> "$GITHUB_OUTPUT"
          done

      - name: Attest release files
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-checksums: assets/netbirdy_${{ needs.meta.outputs.version }}_checksums.txt

      - name: Attest server image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ steps.digests.outputs.server_name }}
          subject-digest: ${{ steps.digests.outputs.server_digest }}
          push-to-registry: true

      - name: Attest dashboard image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ steps.digests.outputs.dashboard_name }}
          subject-digest: ${{ steps.digests.outputs.dashboard_digest }}
          push-to-registry: true

      - name: Attest updater image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ steps.digests.outputs.updater_name }}
          subject-digest: ${{ steps.digests.outputs.updater_digest }}
          push-to-registry: true

      - name: Upload signed assets to the release
        run: |
          find assets -maxdepth 1 -type f \( -name '*.sig' -o -name '*.exe' -o -name '*.pkg' -o -name '*_images.txt' -o -name '*_checksums.txt' -o -name '*.cosign.bundle' -o -name 'netbirdy-ui_*' -o -name 'netbirdy-ui-linux_*' \) ! -name 'netbirdy-ui.exe*' -print0 \
            | xargs -0 gh release upload "$TAG" --clobber

      - name: Mark the release latest
        run: |
          if [ "$STABLE" = "true" ]; then
            gh release edit "$TAG" --latest --draft=false
          else
            gh release edit "$TAG" --prerelease --draft=false
          fi
