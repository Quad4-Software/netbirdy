name: Dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"

jobs:
  lint-typecheck-unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version_file_path: "package.json"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "dashboard/package.json"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter netbirdy-dashboard...

      - name: Check frontend lockfiles
        working-directory: ${{ github.workspace }}
        run: ./scripts/check-frontend-lock.sh

      - name: Lint
        run: pnpm --filter netbirdy-dashboard lint

      - name: Typecheck
        run: |
          pnpm --filter netbirdy-dashboard docs:build
          pnpm --filter netbirdy-dashboard exec tsc --noEmit

      - name: Unit tests
        run: pnpm --filter netbirdy-dashboard test:unit
