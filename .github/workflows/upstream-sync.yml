name: upstream-sync
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    if: github.repository == 'Quad4-Software/netbirdy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_PAT || secrets.GITHUB_TOKEN }}
      - name: detect new upstream tag
        id: tag
        run: |
          git fetch https://github.com/netbirdio/netbird.git 'refs/tags/*:refs/tags/upstream/*'
          LATEST=$(git tag -l 'upstream/v*' --sort=-v:refname | head -1 | sed 's|upstream/||')
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          branch=$(git branch -r --list "origin/sync/$LATEST")
          pr_count=$(gh pr list --state open --head "sync/$LATEST" --json number --jq length)
          if [ -n "$branch" ] || [ "$pr_count" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: sync branch and PR
        if: steps.tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "sync/${{ steps.tag.outputs.tag }}"
          git merge --no-edit --no-commit "upstream/${{ steps.tag.outputs.tag }}" || true
          tools/rebrand/rebrand.sh
          note=""
          if [ -z "$UPSTREAM_SYNC_PAT" ]; then
            dropped=$(git status --porcelain -- .github/workflows | sed -e 's/^...//' -e 's/.* -> //' | sort -u)
          if [ -n "$dropped" ]; then
            git reset -q HEAD -- .github/workflows
            git checkout -- .github/workflows || true
            git clean -fdq -- .github/workflows
            # shellcheck disable=SC2016 # Keep Markdown backticks literal in the generated note.
            note=$(printf '\n\nWorkflow file changes were left out because the token used to push cannot update files under `.github/workflows`. Apply them by hand:\n\n```\ngit fetch https://github.com/netbirdio/netbird.git tag %s\ngit checkout FETCH_HEAD -- .github/workflows\n```\n\nFiles affected:\n\n```\n%s\n```' "${{ steps.tag.outputs.tag }}" "$dropped")
            fi
          fi
          git add -A
          git commit -m "sync upstream ${{ steps.tag.outputs.tag }}" || true
          git push -u origin "sync/${{ steps.tag.outputs.tag }}"
          gh pr create --title "sync upstream ${{ steps.tag.outputs.tag }}" --body "Automated upstream sync. Resolve conflicts marked in the diff before merging.$note" --head "sync/${{ steps.tag.outputs.tag }}" --base main || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SYNC_PAT: ${{ secrets.UPSTREAM_SYNC_PAT }}
