name: Bug report
description: Report a bug in NetBirdy
body:
  - type: input
    attributes:
      label: NetBirdy version
      placeholder: v0.81.1
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
