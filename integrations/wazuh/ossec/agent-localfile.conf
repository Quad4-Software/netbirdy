<!-- Add to the Wazuh agent ossec.conf on the NetBirdy host.
     Point the paths at the podman volume mountpoint:
     podman volume inspect nby-data --format '{{.Mountpoint}}' -->
<localfile>
  <log_format>json</log_format>
  <location>/var/lib/containers/storage/volumes/nby-data/_data/security-events.jsonl</location>
</localfile>
<localfile>
  <log_format>json</log_format>
  <location>/var/lib/containers/storage/volumes/nby-data/_data/audit-events.jsonl</location>
</localfile>
<localfile>
  <log_format>json</log_format>
  <location>/var/lib/containers/storage/volumes/nby-data/_data/shield-events.jsonl</location>
</localfile>
