<!-- Manager-side active response wiring for netbirdy-respond. -->
<ossec_config>
  <command>
    <name>netbirdy-respond</name>
    <executable>netbirdy-respond</executable>
    <expect>srcip</expect>
    <timeout_allowed>no</timeout_allowed>
  </command>
  <active-response>
    <command>netbirdy-respond</command>
    <location>server</location>
    <rules_id>100101,100103</rules_id>
    <level>10</level>
  </active-response>
</ossec_config>
