name: repo-hygiene

when:
  - event: push
    branch: main
  - event: pull_request
  - event: tag
  - event: manual

steps:
  - name: shell-syntax
    image: cgr.dev/chainguard/wolfi-base@sha256:e9b8c3739e5fb5fc778843a2ce74f8620588c9ddc9c44918cead527abcb0b628
    commands:
      - apk add --no-cache bash git
      - git config --global --add safe.directory '*'
      - git ls-files '*.sh' > /tmp/shell-files.txt
      - |
        rc=0
        while IFS= read -r f; do
          shebang=$(head -1 "$f")
          case "$shebang" in
            *bash*) bash -n "$f" || rc=1 ;;
            *) sh -n "$f" || rc=1 ;;
          esac
        done < /tmp/shell-files.txt
        exit $rc

  - name: rebrand-check
    image: cgr.dev/chainguard/wolfi-base@sha256:e9b8c3739e5fb5fc778843a2ce74f8620588c9ddc9c44918cead527abcb0b628
    commands:
      - sh tools/rebrand/rebrand.sh --check

  - name: no-private-keys
    image: cgr.dev/chainguard/wolfi-base@sha256:e9b8c3739e5fb5fc778843a2ce74f8620588c9ddc9c44918cead527abcb0b628
    commands:
      - apk add --no-cache git
      - git config --global --add safe.directory '*'
      - |
        found=$(git ls-files | grep -vE '(^|/)(test_data|testdata|fixtures)/' | xargs grep -lE '^-----BEGIN [A-Z ]*PRIVATE KEY-----' || true)
        if [ -n "$found" ]; then printf '%s\n' "$found"; exit 1; fi

  - name: govulncheck
    # Wolfi base: the govulncheck JSON filter needs python3, which the
    # Chainguard Go image does not ship, so the toolchain is apk-installed.
    image: cgr.dev/chainguard/wolfi-base@sha256:e9b8c3739e5fb5fc778843a2ce74f8620588c9ddc9c44918cead527abcb0b628
    commands:
      - apk add --no-cache go-1.27 python3 git
      - go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -format json ./... > vuln.json || true
      - sh scripts/govulncheck-filter.sh vuln.json
