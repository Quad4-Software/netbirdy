name: podman-stack

when:
  - event: manual

steps:
  - name: build
    image: docker:cli
    commands:
      - docker build -f podman/Containerfile.server -t netbirdy-server .
      - docker build -f podman/Containerfile.dashboard -t netbirdy-dashboard .
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
