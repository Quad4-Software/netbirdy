<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/src/assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetBirdy</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f2ea" />
  </head>
  <body>
    <!-- Go template variables injected here -->
    <script>
      // Resolve theme before paint: dark unless the OS asks for light.
      if (!matchMedia("(prefers-color-scheme: light)").matches) document.documentElement.classList.add("dark");
      window.__DATA__ = {{ .Data }};
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
