version: 2
env:
  - SKIP_PUBLISH={{ if index .Env "SKIP_PUBLISH" }}{{ .Env.SKIP_PUBLISH }}{{ else }}true{{ end }}
  - SKIP_DOCKER_PUSH={{ if index .Env "SKIP_DOCKER_PUSH" }}{{ .Env.SKIP_DOCKER_PUSH }}{{ else }}false{{ end }}
project_name: netbirdy
builds:
  - id: netbirdy-wasm
    dir: client/wasm/cmd
    binary: netbirdy
    env: [GOOS=js, GOARCH=wasm, CGO_ENABLED=0]
    goos:
      - js
    goarch:
      - wasm
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: netbirdy
    dir: client
    binary: netbirdy
    env: [CGO_ENABLED=0]
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - arm
      - amd64
      - arm64
      - 386
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: 386
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - load_wgnt_from_rsrc

  # deb and rpm packages target glibc distributions, so on amd64 and arm64, the only
  # architectures with a PKCS#11 driver, they carry the PKCS#11 store, which links libc.
  # Tarballs, the Alpine-based images and the other architectures keep the static build.
  - id: netbirdy-pkcs11
    dir: client
    binary: netbirdy
    env: [CGO_ENABLED=0]
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - load_wgnt_from_rsrc
      - pkcs11

  # The 32-bit deb architectures, which have no PKCS#11 driver.
  - id: netbirdy-deb-32bit
    dir: client
    binary: netbirdy
    env: [CGO_ENABLED=0]
    goos:
      - linux
    goarch:
      - arm
      - 386
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - load_wgnt_from_rsrc

  # Single-arch builds: nfpm provides is not templated, so the RPM splits per arch. The
  # ones with a PKCS#11 driver carry the store like the deb build above.
  - &netbird_rpm_build
    id: netbirdy-rpm-amd64
    dir: client
    binary: netbirdy
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64]
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - load_wgnt_from_rsrc
      - pkcs11

  - <<: *netbird_rpm_build
    id: netbirdy-rpm-arm64
    goarch: [arm64]

  - <<: *netbird_rpm_build
    id: netbirdy-rpm-arm
    goarch: [arm]
    tags:
      - load_wgnt_from_rsrc

  - <<: *netbird_rpm_build
    id: netbirdy-rpm-386
    goarch: [386]
    tags:
      - load_wgnt_from_rsrc

  - id: netbirdy-static
    dir: client
    binary: netbirdy
    env: [CGO_ENABLED=0]
    goos:
      - linux
    goarch:
      - mips
      - mipsle
      - mips64
      - mips64le
    gomips:
      - hardfloat
      - softfloat
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - load_wgnt_from_rsrc

  - id: netbirdy-mgmt
    dir: management
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Runtime.Goos "linux" }}
          {{- if eq .Arch "arm64"}}CC=aarch64-linux-gnu-gcc{{- end }}
          {{- if eq .Arch "arm"}}CC=arm-linux-gnueabihf-gcc{{- end }}
        {{- end }}
    binary: netbirdy-mgmt
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: netbirdy-signal
    dir: signal
    env: [CGO_ENABLED=0]
    binary: netbirdy-signal
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: netbirdy-relay
    dir: relay
    env: [CGO_ENABLED=0]
    binary: netbirdy-relay
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: netbirdy-server
    dir: combined
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Runtime.Goos "linux" }}
          {{- if eq .Arch "arm64"}}CC=aarch64-linux-gnu-gcc{{- end }}
          {{- if eq .Arch "arm"}}CC=arm-linux-gnueabihf-gcc{{- end }}
        {{- end }}
    binary: netbirdy-server
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: netbirdy-upload
    dir: upload-server
    env: [CGO_ENABLED=0]
    binary: netbirdy-upload
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: netbirdy-proxy
    dir: proxy/cmd/proxy
    env: [CGO_ENABLED=0]
    binary: netbirdy-proxy
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.Commit={{.Commit}} -X main.BuildDate={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: nblink
    dir: client/link/cmd/nblink
    env: [CGO_ENABLED=0]
    binary: nblink
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: netbirdy-idp-migrate
    dir: tools/idp-migrate
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Runtime.Goos "linux" }}
          {{- if eq .Arch "arm64"}}CC=aarch64-linux-gnu-gcc{{- end }}
          {{- if eq .Arch "arm"}}CC=arm-linux-gnueabihf-gcc{{- end }}
        {{- end }}
    binary: netbirdy-idp-migrate
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

universal_binaries:
  - id: netbirdy

archives:
  - builds:
      - netbirdy
      - netbirdy-static
  - id: netbirdy-wasm
    builds:
      - netbirdy-wasm
    name_template: "{{ .ProjectName }}_{{ .Version }}"
    format: binary
  - id: netbirdy-idp-migrate
    builds:
      - netbirdy-idp-migrate
    name_template: "netbirdy-idp-migrate_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: nblink
    builds:
      - nblink
    name_template: "nblink_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # goreleaser archives as tar.gz everywhere unless told otherwise, and
    # nblink is downloaded and extracted by hand on Windows too.
    format_overrides:
      - goos: windows
        format: zip

nfpms:
  - maintainer: NetBirdy <https://github.com/Sudo-Ivan/netbirdy>
    description: NetBirdy client.
    homepage: https://github.com/Sudo-Ivan/netbirdy
    license: BSD-3-Clause
    vendor: NetBirdy
    id: netbird_deb
    bindir: /usr/bin
    builds:
      - netbirdy-pkcs11
      - netbirdy-deb-32bit
    formats:
      - deb
    # Drop-in upgrade for an existing netbird install: apt replaces the old
    # package in place and the binary symlink keeps scripts calling netbird.
    provides:
      - netbird
    replaces:
      - netbird
    conflicts:
      - netbird
    contents:
      - src: netbirdy
        dst: /usr/bin/netbird
        type: symlink
    scripts:
      postinstall: "release_files/post_install.sh"
      preremove: "release_files/pre_remove.sh"

  - &netbird_rpm
    maintainer: NetBirdy <https://github.com/Sudo-Ivan/netbirdy>
    description: NetBirdy client.
    homepage: https://github.com/Sudo-Ivan/netbirdy
    license: BSD-3-Clause
    vendor: NetBirdy
    id: netbird_rpm_amd64
    bindir: /usr/bin
    ids:
      - netbirdy-rpm-amd64
    formats:
      - rpm
    # Red Hat certification (RPM Version Handling) requires rpmbuild's ISA
    # provide, which nfpm does not emit. The version is filled in by the release job.
    provides:
      - "netbirdy(x86-64) = @RPM_EVR@"
      - "netbird = @RPM_EVR@"
    replaces:
      - netbird
    conflicts:
      - netbird
    # The client verifies TLS to management and signal against the system trust
    # store. Red Hat software certification (RPM Dependency Tracking) also
    # rejects packages that declare no dependencies at all.
    dependencies:
      - ca-certificates
    # Generated in CI by chglog from git tags; Red Hat certification requires an
    # RPM changelog (RPM Version Handling subtest).
    changelog: changelog.yml
    # License, documentation and a config file so the RPM Provenance subtest sees
    # %license, %doc and %config entries instead of a bare binary.
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/netbirdy/LICENSE
        type: license
      - src: README.md
        dst: /usr/share/doc/netbirdy/README.md
        type: doc
      - src: netbirdy
        dst: /usr/bin/netbird
        type: symlink
      - src: release_files/netbirdy.sysconfig
        dst: /etc/sysconfig/netbirdy
        type: config|noreplace
        # May hold the PKCS#11 token PIN (NB_TPM_PIN), so readable by root alone.
        file_info:
          mode: 0600
    scripts:
      postinstall: "release_files/post_install.sh"
      preremove: "release_files/pre_remove.sh"
    rpm:
      summary: NetBirdy client
      group: Applications/Internet
      packager: NetBirdy <https://github.com/Sudo-Ivan/netbirdy>
      signature:
        key_file: '{{ if index .Env "GPG_RPM_KEY_FILE" }}{{ .Env.GPG_RPM_KEY_FILE }}{{ end }}'

  - <<: *netbird_rpm
    id: netbird_rpm_arm64
    ids:
      - netbirdy-rpm-arm64
    provides:
      - "netbirdy(aarch-64) = @RPM_EVR@"

  - <<: *netbird_rpm
    id: netbird_rpm_arm
    ids:
      - netbirdy-rpm-arm
    provides:
      - "netbirdy(armv6hl-32) = @RPM_EVR@"

  - <<: *netbird_rpm
    id: netbird_rpm_386
    ids:
      - netbirdy-rpm-386
    provides:
      - "netbirdy(x86-32) = @RPM_EVR@"
dockers_v2:
   - id: netbirdy
     disable: "{{ .Env.SKIP_DOCKER_PUSH }}"
     ids:
       - netbirdy
     images:
       - ghcr.io/sudo-ivan/netbirdy
     tags:
       - "{{ .Version }}"
       - "{{ if eq .Env.SKIP_PUBLISH \"false\" }}latest{{ end }}"
     dockerfile: client/Dockerfile
     extra_files:
       - client/netbirdy-entrypoint.sh
     platforms:
       - linux/amd64
       - linux/arm64
       - linux/arm/6
     annotations:
       "org.opencontainers.image.created": "{{.Date}}"
       "org.opencontainers.image.title": "{{.ProjectName}}"
       "org.opencontainers.image.version": "{{.Version}}"
       "org.opencontainers.image.revision": "{{.FullCommit}}"
       "org.opencontainers.image.source": "{{.GitURL}}"
       "maintainer": "https://github.com/Sudo-Ivan/netbirdy"
